name: dbt CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_finance_variance
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Set up dbt profile
        run: cp profiles.example.yml profiles.yml

      - name: dbt build (seed + models + tests)
        env:
          DBT_PROFILES_DIR: .
        run: dbt build

  dbt-build-gpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_gpu_cost_attribution
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Set up dbt profile
        run: cp profiles.example.yml profiles.yml

      - name: dbt build (seed + models + data/unit/singular tests)
        env:
          DBT_PROFILES_DIR: .
        run: dbt build

  dbt-build-leo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_leo_program_finance
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Set up dbt profile
        run: cp profiles.example.yml profiles.yml

      - name: dbt build (seeds + 29 marts + 219 data/singular tests)
        env:
          DBT_PROFILES_DIR: .
        run: dbt build

  dbt-build-snowflake-finops:
    runs-on: ubuntu-latest
    # GitHub Actions disallows `secrets` in a job-level `if:` (only github/needs/vars/inputs are
    # permitted there -- referencing secrets there fails the whole workflow at parse time, not
    # just this job). The documented workaround: gate via a job-level env var instead, checked on
    # every step, so the job reports "skipped" (not "failed") until real credentials exist.
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    defaults:
      run:
        working-directory: dbt_snowflake_finops
    steps:
      - name: Check out
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-snowflake
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        run: pip install dbt-snowflake

      - name: Set up dbt profile
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        run: cp profiles.example.yml profiles.yml

      - name: dbt build (seed + bronze/silver/gold + data/unit/singular tests)
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: dbt build

  airflow-dag-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow + Cosmos
        run: |
          pip install "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install "astronomer-cosmos>=1.8,<2" dbt-duckdb duckdb

      - name: DAG import test (DagBag)
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          # No Airflow metadata DB in CI -- disable Cosmos's Variable-backed
          # dbt-ls cache (a parse-time optimization, not needed to validate).
          AIRFLOW__COSMOS__ENABLE_CACHE: "False"
        run: |
          python - <<'EOF'
          from airflow.models import DagBag
          db = DagBag("airflow_orchestration/dags", include_examples=False)
          assert not db.import_errors, f"DAG import errors: {db.import_errors}"
          assert "finance_variance_pipeline" in db.dags, "finance_variance_pipeline not found"
          dag = db.dags["finance_variance_pipeline"]
          print(f"OK: {dag.dag_id} with {len(dag.tasks)} tasks:")
          for t in dag.tasks:
              print("  -", t.task_id)
          EOF
