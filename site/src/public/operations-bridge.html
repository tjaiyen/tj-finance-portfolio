<style>
.obc{
  --c-bg:#0a0e16; --c-panel:#0c111c; --c-surface:#131a29; --c-surface2:#1b2334;
  --c-line:rgba(150,170,210,.16); --c-line2:rgba(150,170,210,.28);
  --c-ink:#e9eef8; --c-muted:#8a97ad; --c-faint:#5d6b84;
  --c-accent:#4aa3ff; --c-accent2:#6ee7ff; --c-accent-ink:#04121f; --c-good:#3ecf8e;
  --c-bad:#ef5f6b; --c-warn:#f5b13d; --c-info:#8b9bff;
  --bg:var(--c-bg); --panel:var(--c-panel); --surface:var(--c-surface); --surface2:var(--c-surface2);
  --line:var(--c-line); --line2:var(--c-line2); --ink:var(--c-ink); --muted:var(--c-muted); --faint:var(--c-faint);
  --accent:var(--c-accent); --accent2:var(--c-accent2); --accent-ink:var(--c-accent-ink); --good:var(--c-good);
  --bad:var(--c-bad); --warn:var(--c-warn); --info:var(--c-info);
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:"Space Grotesk",var(--sans);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-family:var(--sans); background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  transition:background .25s ease, color .25s ease;
  /* Lock the shell to exactly one viewport so the iframe is the ONLY scroller.
     `.obc *` below sets border-box on descendants only, so .obc needs it explicitly —
     without it the safe-area padding adds to 100dvh and the outer scrollbar returns. */
  box-sizing:border-box;
  height:100vh; height:100dvh; overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
.obc[data-theme="light"]{
  --c-bg:#eef2f8; --c-panel:#ffffff; --c-surface:#ffffff; --c-surface2:#e7edf6;
  --c-line:rgba(30,55,100,.15); --c-line2:rgba(30,55,100,.26); --c-ink:#111c30; --c-muted:#53637e; --c-faint:#8090a8;
  --c-accent:#1f6fe0; --c-accent2:#0c86a6; --c-accent-ink:#ffffff; --c-good:#12885a;
  --c-bad:#c8324a; --c-warn:#9a6410; --c-info:#3f52cc;
}
.obc *{box-sizing:border-box}
.obc .bar{display:flex; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--line);
  background:var(--panel); position:sticky; top:0; z-index:20; flex-wrap:wrap}
.obc .mark{display:flex; align-items:center; gap:9px; font-family:var(--disp); font-weight:700; letter-spacing:.02em; font-size:14px; white-space:nowrap}
.obc .mark small{font-weight:600; letter-spacing:.12em; color:var(--muted); font-size:9.5px; font-family:var(--mono)}
.obc .glyph{width:20px; height:20px; border-radius:6px; position:relative;
  background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent)); box-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.obc .glyph::after{content:""; position:absolute; inset:5px; border-radius:3px; background:var(--panel)}
.obc [role="tablist"]{display:flex; gap:4px; flex-wrap:wrap}
.obc .tab{background:transparent; border:1px solid var(--line); color:var(--muted); padding:6px 12px; border-radius:8px;
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s}
.obc .tab:hover{color:var(--ink); border-color:var(--line2)}
.obc .tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.obc .tab[data-lvl="L0"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent2) 30%,transparent)}
.obc .tab.hidden{display:none}
.obc .tab:focus-visible,.obc .ico:focus-visible{outline:2px solid var(--accent2); outline-offset:2px}
.obc .right{margin-left:auto; display:flex; align-items:center; gap:6px}
.obc .hint{font:500 11px/1 var(--mono); color:var(--muted); white-space:nowrap; margin-right:4px}
.obc .hint b{color:var(--good)}
.obc .ico{display:inline-flex; align-items:center; justify-content:center; gap:5px; width:32px; height:30px;
  background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--muted); cursor:pointer; transition:all .15s; padding:0}
.obc .ico:hover{color:var(--ink); border-color:var(--line2)}
.obc .ico[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.obc .ico.wide{width:auto; padding:0 10px; font:600 11.5px var(--sans)}
.obc .ico svg{width:16px; height:16px}
.obc .kbd{font:600 9.5px var(--mono); border:1px solid var(--line2); border-radius:4px; padding:1px 4px; color:var(--muted)}
.obc .stage{flex:1; position:relative; background:var(--bg)}
.obc iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); opacity:1; transition:opacity .18s ease}
.obc iframe.fading{opacity:0}
.obc .skel{position:absolute; inset:0; padding:22px 26px; display:flex; flex-direction:column; gap:14px; background:var(--bg)}
.obc .skel.hidden{display:none}
.obc .skrow{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
.obc .skbox{height:74px; border-radius:12px; background:linear-gradient(100deg,var(--surface),var(--surface2),var(--surface));
  background-size:200% 100%; animation:obsh 1.2s linear infinite}
.obc .skbox.tall{height:230px; grid-column:1/-1}
@keyframes obsh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* command palette */
.obc .cmdk{position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center;
  background:color-mix(in srgb,#000 55%,transparent); padding-top:10dvh}
.obc .cmdk.open{display:flex}
.obc .cmdk-box{width:min(600px,92vw); background:var(--surface); border:1px solid var(--line2); border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.5); overflow:hidden}
.obc .cmdk-in{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.obc .cmdk-in svg{width:18px; height:18px; color:var(--muted); flex:none}
.obc .cmdk-in input{flex:1; background:none; border:0; outline:none; color:var(--ink); font:inherit; font-size:15px}
.obc .cmdk-list{max-height:min(52dvh,420px); overflow-y:auto; padding:6px}
.obc .cmdk-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px}
.obc .cmdk-row .rk{margin-left:auto; font:600 9.5px var(--mono); color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
.obc .cmdk-row .sv{width:7px; height:7px; border-radius:50%; flex:none}
.obc .cmdk-row[aria-selected="true"]{background:var(--surface2)}
.obc .cmdk-empty{padding:20px; text-align:center; color:var(--muted); font-size:13px}
/* tour */
.obc .tour{position:fixed; right:20px; bottom:20px; z-index:55; width:min(360px,92vw); background:var(--surface);
  border:1px solid var(--line2); border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.45); padding:16px 18px; display:none}
.obc .tour.open{display:block}
.obc .tour h4{margin:0 0 6px; font-family:var(--disp); font-size:15px}
.obc .tour p{margin:0 0 12px; color:var(--muted); font-size:12.5px; line-height:1.5}
.obc .tour .row{display:flex; align-items:center; gap:8px}
.obc .tour .dots{display:flex; gap:4px; margin-right:auto}
.obc .tour .dot{width:6px; height:6px; border-radius:50%; background:var(--line2)}
.obc .tour .dot.on{background:var(--accent)}
.obc .tour button{font:600 12px var(--sans); border-radius:7px; padding:6px 12px; cursor:pointer; border:1px solid var(--line2); background:var(--surface2); color:var(--ink)}
.obc .tour button.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
/* guide slide-over */
.obc .ig-scrim{position:fixed; inset:0; z-index:58; background:color-mix(in srgb,#000 45%,transparent); opacity:0; pointer-events:none; transition:opacity .2s}
.obc .ig-scrim.open{opacity:1; pointer-events:auto}
.obc .ig-panel{position:fixed; top:0; right:0; bottom:0; z-index:59; width:min(440px,94vw); background:var(--surface);
  border-left:1px solid var(--line2); box-shadow:-18px 0 60px rgba(0,0,0,.4); transform:translateX(102%); transition:transform .24s ease;
  overflow-y:auto; padding:0 22px 40px}
.obc .ig-panel.open{transform:none}
.obc .ig-top{position:sticky; top:0; background:var(--surface); display:flex; align-items:center; gap:10px; padding:16px 0 12px; border-bottom:1px solid var(--line); margin-bottom:14px}
.obc .ig-top .t{font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.02em}
.obc .ig-top .x{margin-left:auto; width:28px; height:28px; border:1px solid var(--line); border-radius:7px; background:none; color:var(--muted); cursor:pointer; font-size:16px}
.obc .ig-top .x:hover{color:var(--ink); border-color:var(--line2)}
.obc .ig-eyebrow{font:600 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.obc .ig-h h3{font-family:var(--disp); font-size:20px; margin:3px 0 0}
.obc .ig-purpose{font-size:14px; color:var(--ink); line-height:1.5; margin:12px 0}
.obc .ig-sec{font:700 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px}
.obc .ig-panel p{font-size:12.5px; color:var(--muted); line-height:1.55; margin:0 0 4px}
.obc .ig-ex{color:var(--ink)!important; padding:10px 12px; background:var(--surface2); border-radius:8px; border-left:2px solid var(--accent)}
.obc .ig-tools{margin:4px 0; padding-left:18px}
.obc .ig-tools li{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:4px}
.obc .ig-tools b{color:var(--ink)}
.obc .ig-metric{border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; background:var(--panel)}
.obc .ig-mname{font-weight:700; font-size:12.5px; color:var(--ink)}
.obc .ig-mmeans{font-size:12px; color:var(--muted); line-height:1.5; margin-top:3px}
.obc .ig-mex{font-size:11px; color:var(--ink); margin-top:5px; font-family:var(--mono)}
.obc .ig-mex span{color:var(--accent); font-weight:700}
.obc .ig-foot{margin-top:20px; padding-top:12px; border-top:1px solid var(--line); font-size:10.5px; color:var(--faint); line-height:1.5}

@media(max-width:720px){
  .obc .hint{display:none}
  /* Tab bar becomes a single swipeable strip instead of wrapping to ~225px tall. */
  .obc .bar{flex-wrap:nowrap; gap:8px;
    padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}
  /* The wordmark is redundant on a phone and costs ~28px of tab strip. */
  .obc .mark{display:none}
  /* min-width:0 is load-bearing: a flex item defaults to min-width:auto and would refuse
     to shrink below its content, pushing .right off-screen instead of scrolling.
     Deliberately NO scroll-snap: it re-snaps programmatic scrollLeft back to the nearest
     tab start, which silently swallowed keepTabVisible()'s scroll (measured). */
  .obc [role="tablist"]{flex:1 1 auto; min-width:0; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
    scrollbar-width:none; padding:2px 0}
  .obc [role="tablist"]::-webkit-scrollbar{display:none}
  .obc .tab{flex:0 0 auto; min-height:38px; padding:9px 13px}
  .obc .right{flex:0 0 auto; margin-left:0; gap:5px}
  .obc .ico{min-width:38px; height:38px}
  .obc .ico.wide{width:38px; padding:0}
  /* Guide keeps its icon but drops its text label — the words cost ~35px of tab strip. */
  .obc #obGuide{font-size:0; gap:0}
  /* Desktop-only affordances: the palette needs a hardware keyboard, interview mode is a
     desktop demo path, and compact density would shrink body text to 13px on the smallest
     screens — the opposite of what we want here. Leaves Guide + Tour + Theme. */
  .obc #obCmdk, .obc #obDemo, .obc #obDensity{display:none}
  .obc .tour{left:10px; right:10px; width:auto; bottom:calc(10px + env(safe-area-inset-bottom))}
  .obc .ig-panel{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){ .obc *{transition:none!important; animation:none!important} }

<script>
"use strict";
/* ============================================================================
   INSIGHT ENGINE — plain-language "what it does / why / example" for every
   dashboard, plus a DETERMINISTIC narrator that explains the significance of a
   value from the number + its thresholds (rule-based, no LLM, fully traceable).

   EDIT ME: `INSIGHT` below is the single editable registry — change a tab's
   purpose / why / example / tools / metric meanings here and the Guide panel
   updates everywhere. `narrate()` is the value-significance engine.
   ============================================================================ */
"use strict";

/* ---- narrate(type, value, opts): a plain-language read of one value ----
   types: cpi | spi | tcpi | variancePct | currency | pctComplete | onTimeRate | ratio | count
   opts:  { band, favorable (bool), unit, subject } — all optional            */
function narrate(type, value, opts){
  opts = opts || {};
  var v = value, band = opts.band;
  function pct(x){ return (x*100).toFixed(x*100 % 1 === 0 ? 0 : 1) + "%"; }
  switch(type){
    case "cpi": case "spi": {
      var kind = type === "cpi" ? "cost" : "schedule";
      var cents = Math.round(v * 100);
      var read = v >= 1
        ? "at or ahead of plan — not eating into contingency"
        : v >= 0.95
          ? "slipping, but inside the 0.95 watch band — monitor, don't escalate yet"
          : "below the 0.95 floor — needs a recovery plan, not just watching";
      return "You're earning about " + cents + "¢ of planned work for every $1 of " + kind + " so far. " + read + ".";
    }
    case "tcpi":
      return v > 1
        ? "The remaining work would have to run at " + v.toFixed(3) + " efficiency to still finish on budget — i.e. BEAT the plan. That's a recovery red flag; the budget is likely gone."
        : "The remaining work only needs " + v.toFixed(3) + " efficiency to finish on budget — achievable at the current run rate.";
    case "variancePct": {
      var mag = Math.abs(v), dir = opts.favorable ? "favorable" : "unfavorable";
      var over = band != null && mag > band;
      return pct(mag) + " " + dir + " vs. the baseline. " + (over
        ? "That exceeds the ±" + pct(band) + " materiality band, so a written variance analysis is triggered."
        : "That's inside the ±" + (band!=null?pct(band):"5%") + " band — routine noise, no write-up needed.");
    }
    case "currency": {
      var d = opts.favorable == null ? "" : (opts.favorable ? " favorable" : " unfavorable");
      return "$" + Math.abs(v).toLocaleString() + d + (opts.subject ? " — " + opts.subject : "") + ".";
    }
    case "pctComplete":
      return pct(v) + " of the budget-at-completion has been physically earned so far.";
    case "onTimeRate":
      return pct(v) + " of promised deliveries arrived on time. " + (band!=null && v < band
        ? "Below the " + pct(band) + " floor — a supplier-reliability flag."
        : "At or above the " + (band!=null?pct(band):"85%") + " floor.");
    case "count":
      return v + " " + (opts.unit || "item(s)") + (opts.subject ? " — " + opts.subject : "") + ".";
    default:
      return String(value) + (opts.subject ? " — " + opts.subject : "");
  }
}

/* ---- EDITABLE registry: purpose / why / example / tools / metrics per tab ---- */
var INSIGHT = {
  "command-center": {
    title: "Command Center",
    purpose: "The bridge — is the plant healthy? One glance across cost, cash, controls, food-safety and capital projects.",
    why: "A finance lead shouldn't have to open 25 tools to know where to spend attention. This rolls every tool up to one screen and ranks the exceptions worst-first, so the first five minutes go to what actually moves money or risk.",
    example: "Two critical items (a PACA borrowing-base carve-out and an FSMA lot missing all 5 tracking events) sit above ten lower findings — so those two get escalated same-day, everything else waits.",
    tools: [{ name: "Cross-tool synthesizer", does: "collapses the other tools' verified findings into one ranked action list" }],
    metrics: [
      { name: "Prioritized findings", means: "How many flagged items the whole engine surfaced this period, ranked by severity.", ex: "10 findings — 2 critical, then serious, then warnings." },
      { name: "Recoverable leak", means: "Money already spent but not yet billed back or priced in — cash you can still recover.", ex: "$20.2K across two customers, rebillable to AR." },
      { name: "Borrowing base at risk", means: "Collateral value a lender will stop counting — here, a PACA grower-trust claim that can jump ahead of the bank.", ex: "$12.0K carved out of the borrowing base." }
    ]
  },
  "cost-variance": {
    title: "Cost & Variance",
    purpose: "Where every dollar actually landed vs. where the standard said it should — and why.",
    why: "Standard costs drift. Catching a purchase-price or usage variance early — before it's baked into inventory and the P&L — is the difference between a $5K note and a $50K surprise at close.",
    example: "A flat annual cost average looked fine (−4% vs standard), but broken out by quarter it hid a +17.7% Q4 swing on corn — real cost pressure the annual number averaged away.",
    tools: [
      { name: "Variance Narrator", does: "writes the CFO-facing 'why' for each material account move" },
      { name: "Cost-Roll Validator", does: "checks standard costs against trailing PO history (seasonal-aware)" },
      { name: "Standard-Cost Monte Carlo", does: "simulates a plausible-cost band to test if a standard is realistic" },
      { name: "Margin-Leak Analyzer", does: "finds ancillary costs (freight/storage) never billed or underpriced" },
      { name: "Yield/Mix, Energy, GL Tie-Out", does: "decompose usage variance and tie the sub-ledger to the GL" }
    ],
    metrics: [
      { name: "Materiality band", means: "How big a variance has to be, as a % of its baseline, before it's worth a human's attention.", ex: "5% — a $38K freight move (31.7%) gets written up; a 0.04% move doesn't. Drag the slider to see the flag set change." },
      { name: "PPV / net variance ($)", means: "Actual cost minus standard cost — unfavorable (over) or favorable (under).", ex: "$38K unfavorable on freight from a fuel surcharge." }
    ]
  },
  "wip-inventory": {
    title: "WIP & Inventory",
    purpose: "What a lender will actually count as collateral, and whether the book agrees with the warehouse.",
    why: "Inventory on the books is not inventory a bank will lend against. Aged, consigned, or PACA-encumbered stock quietly drops out of the borrowing base — and a book-vs-count gap is either shrink or a control failure.",
    example: "$376K of frozen goods was on the books, but after aging, a consignment, and a PACA trust carve-out, only $199K was actually eligible collateral.",
    tools: [
      { name: "BBC Eligibility Checker", does: "computes lender-eligible availability after every carve-out" },
      { name: "Cycle Count Reconciler", does: "flags book-vs-physical count variances beyond the band" }
    ],
    metrics: [
      { name: "Eligible availability", means: "The dollar value of inventory a lender will actually advance against, after exclusions.", ex: "$199.0K of $376K gross." },
      { name: "PACA carve-out", means: "Value removed because an unpaid grower's federal trust claim outranks the bank's.", ex: "$12.0K carved out on one raw-pea line." }
    ]
  },
  "production-ops": {
    title: "Production & Ops",
    purpose: "Plant-floor signals that turn into cost: food-safety traceability, labor & energy efficiency, throughput.",
    why: "A missing tracking event can fail a 24-hour FDA recall request; a stuck labor number can hide an efficiency problem for weeks. These catch the operational conditions before they become financial ones.",
    example: "One lot was missing all five required Critical Tracking Events — it would not survive an FDA records request, regardless of its cost.",
    tools: [
      { name: "FSMA Traceability", does: "checks each lot for the 5 required tracking events + complete data" },
      { name: "Operations Monitor", does: "spots trend breaks, flatlines and missing periods in the labor series" },
      { name: "Labor Efficiency & Carbon Throughput", does: "split labor variance into rate vs. efficiency; rank product mix by $ vs. carbon" }
    ],
    metrics: [
      { name: "CTE completeness", means: "Whether a lot has all 5 FDA-required tracking events with complete data.", ex: "LOT-5001 missing all 5 — a recall-readiness failure." },
      { name: "Labor rate vs. efficiency variance", means: "Splits a labor cost miss into paid-more-per-hour (rate) vs. used-more-hours (efficiency).", ex: "$360 total = $180 rate + $180 efficiency." }
    ]
  },
  "ap-procurement": {
    title: "AP & Procurement",
    purpose: "Three checks between a purchase order and a payment: 3-way match, disbursement timing, vendor reliability.",
    why: "An invoice alone is never enough to trust. Matching it to the PO and the goods receipt catches overbills, duplicates and phantom invoices before cash goes out — and a chronically-late vendor is a supply risk, not just a cost.",
    example: "The same $300 salt invoice landed twice, and a packaging line billed 4,000 units against 3,600 received — both caught before payment.",
    tools: [
      { name: "AP 3-Way Match", does: "matches invoice ↔ PO ↔ receipt; fails on any price/qty/duplicate/vendor mismatch" },
      { name: "Disbursement Analyzer", does: "flags missed early-pay discounts and premature/late payments" },
      { name: "Vendor Scorecard", does: "scores on-time rate and price-variance rate per vendor" }
    ],
    metrics: [
      { name: "Price variance", means: "Invoiced unit price meaningfully above the agreed PO price.", ex: "Corn billed at $0.675 vs a $0.54 PO — +25%, above the 5% band." },
      { name: "On-time delivery rate", means: "Of a vendor's dated deliveries, the share that arrived on or before the promise.", ex: "Highline Ag at 0% — below the 85% floor, $6K process impact." }
    ]
  },
  "controls-compliance": {
    title: "Controls & Compliance",
    purpose: "The audit-facing layer: two systems tie out, GAAP cost rules hold, every claim traces to real data.",
    why: "This is what an auditor or lender covenant actually tests. ASC 330 governs whether abnormal cost can sit in inventory; a claim that can't be traced to a source row is exactly the fabrication risk the engine is built to prevent.",
    example: "$8,000 of abnormal idle-capacity cost was capitalized into inventory — ASC 330-10-30-3 requires it be expensed immediately, so it's flagged.",
    tools: [
      { name: "Reconciliation Checker", does: "ties ERP vs CPM, separating real gaps from timing differences" },
      { name: "GAAP Cost Compliance", does: "checks ASC 330 variance-disposition and lower-of-cost-or-NRV rules" },
      { name: "Data Provenance, Doc Control, PBC, AI Governor", does: "audit trail integrity, PBC-list readiness, and human-oversight coverage on automation" }
    ],
    metrics: [
      { name: "NRV write-down", means: "The per-unit amount standard cost exceeds net realizable value — ASC 330-10-35 requires writing it down.", ex: "Peas: $0.50 standard vs $0.47 NRV → $0.03/lb write-down." },
      { name: "Disposition flag", means: "Abnormal idle/spoilage cost that was capitalized instead of expensed.", ex: "$8,000 idle-capacity cost wrongly capitalized." }
    ]
  },
  "pnl-synthesis": {
    title: "P&L & Synthesis",
    purpose: "Plan-vs-latest-estimate over time, the cross-tool action list, and where the finance function itself is weakest.",
    why: "A single period can look fine while the year-to-date quietly breaches. Time-phasing catches the slow drift; the synthesizer turns 10 tool findings into one prioritized push; the maturity read says what to fix first.",
    example: "COGS was within band in June alone, but the cumulative year-to-date variance had already breached the 5% line — a drift no single month showed.",
    tools: [
      { name: "Time-Phased P&L", does: "phases the annual plan into periods and flags period + cumulative variance" },
      { name: "Cross-Tool Synthesizer", does: "ranks all tools' findings into an immediate/this-week/this-month action list" },
      { name: "Infra Maturity Assessor", does: "scores the finance function's domains and weights the highest-priority gap" }
    ],
    metrics: [
      { name: "Cumulative variance", means: "Year-to-date plan-vs-estimate — catches slow drift a single period hides.", ex: "COGS cum −$32K, past the 5% band, while June alone looked fine." },
      { name: "Maturity score", means: "A 0–4 read of a finance domain, weighted by priority.", ex: "Systems/data/automation at 1.6/4 — the top-priority gap." }
    ]
  },
  "capital-evm": {
    title: "Capital Projects (EVM)",
    purpose: "Earned Value Management over a project's work breakdown — is a capital build on cost, on schedule, and will it finish on budget?",
    why: "A capex build has a baseline, a schedule and progressive completion — the one place a food plant genuinely needs project controls. EVM turns 'we've spent $3M' into 'we've spent $3M to earn $2.87M of a $4.46M plan, and at this rate we'll overrun by $200K.'",
    example: "The freezer expansion is 64% complete but its CPI is 0.957 and SPI 0.899 — slightly over budget and behind schedule — forecasting a $200K overrun (EAC $4.66M vs $4.46M budget).",
    tools: [{ name: "Earned Value Manager", does: "rolls PV/EV/AC up a WBS, computes CPI/SPI/TCPI/EAC/VAC, and flags variance breaches" }],
    metrics: [
      { name: "CPI (cost index)", means: narrate("cpi", 0.957), ex: "0.957 → watch band." },
      { name: "SPI (schedule index)", means: narrate("spi", 0.899), ex: "0.899 → at-risk, behind schedule." },
      { name: "EAC / VAC", means: "Estimate-at-completion is the forecast total cost; VAC (budget − EAC) is the projected over/underrun.", ex: "EAC $4.66M, VAC −$200K (overrun)." },
      { name: "TCPI", means: narrate("tcpi", 1.09), ex: "Above 1.0 here — recovery would mean beating the plan." },
      { name: "Variance analysis (VAR)", means: "A node whose cost or schedule variance exceeds ±10% (the EIA-748/CPR trip-wire) requires a written explanation. Drag the slider to re-flag live.", ex: "12 of 20 measurable nodes breach at the real 10%." }
    ]
  }
};

/* ---- renderGuide(slug): build the Guide panel HTML for a tab ---- */
function insightGuide(slug){
  var g = INSIGHT[slug];
  if(!g) return '<div class="ig-empty">No guide for this tab yet.</div>';
  var esc = function(s){ return String(s).replace(/[&<>]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); };
  var tools = (g.tools||[]).map(function(t){ return '<li><b>'+esc(t.name)+'</b> — '+esc(t.does)+'</li>'; }).join("");
  var metrics = (g.metrics||[]).map(function(m){
    return '<div class="ig-metric"><div class="ig-mname">'+esc(m.name)+'</div><div class="ig-mmeans">'+esc(m.means)+'</div>'
      + (m.ex ? '<div class="ig-mex"><span>e.g.</span> '+esc(m.ex)+'</div>' : '') + '</div>';
  }).join("");
  return ''
    + '<div class="ig-h"><div class="ig-eyebrow">What this dashboard does</div><h3>'+esc(g.title)+'</h3></div>'
    + '<p class="ig-purpose">'+esc(g.purpose)+'</p>'
    + '<div class="ig-sec">Why it matters</div><p>'+esc(g.why)+'</p>'
    + '<div class="ig-sec">A concrete example</div><p class="ig-ex">'+esc(g.example)+'</p>'
    + (tools ? '<div class="ig-sec">The tools here</div><ul class="ig-tools">'+tools+'</ul>' : '')
    + (metrics ? '<div class="ig-sec">What each value means</div>'+metrics : '')

var DEMO = ["command-center","cost-variance","capital-evm","controls-compliance"];
var TOUR = [
  {slug:"command-center", title:"Command Center", body:"The bridge: one glance across cost, cash, controls, food-safety and capital projects. Every tile rolls up a deterministic tool — click one to drill in."},
  {slug:"cost-variance", title:"Cost & Variance", body:"Standard-cost, PPV, yield/mix, energy and GL tie-out. Drag a materiality slider to re-flag variances live."},
  {slug:"capital-evm", title:"Capital Projects (EVM)", body:"Full earned-value management over a WBS — CPI/SPI, EAC forecasts, VAC and the ±10% variance trip-wire."},
  {slug:"controls-compliance", title:"Controls & Compliance", body:"Reconciliation, GAAP/ASC 330, data provenance and PBC readiness — the audit-facing controls layer."}
];
var root=document.getElementById("obcRoot"), frame=document.getElementById("obcFrame"), skel=document.getElementById("obSkel");
var tabs=[].slice.call(root.querySelectorAll(".tab"));
var findings={}; // slug -> [{label,sev}]
function store(k,v){ try{localStorage.setItem(k,v);}catch(e){} } function load(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
var theme=load("ob.theme")||"dark", density=load("ob.density")||"comfortable", current=TABS[0].slug, demoOn=false, ready={};
/* ---- fonts: load into the shell itself too ---- */
(function(){ function add(fam,b64,w){ if(!b64) return; try{ var f=new FontFace(fam,'url(data:font/woff2;base64,'+b64+') format("woff2")',{weight:w,display:"swap"}); f.load().then(function(x){document.fonts.add(x);}).catch(function(){});}catch(e){} }
  add("DM Sans",FONTS.sans,"100 1000"); add("Space Grotesk",FONTS.disp,"300 700"); })();
/* ---- theme / density ---- */
function applyChrome(){ root.dataset.theme=theme; root.dataset.density=density;
  document.getElementById("obTheme").setAttribute("aria-pressed", theme==="light");
  document.getElementById("obDensity").setAttribute("aria-pressed", density==="compact"); }
function broadcast(){ try{ frame.contentWindow.postMessage({obTheme:theme, obDensity:density, obFonts:FONTS}, "*"); }catch(e){} }
document.getElementById("obTheme").addEventListener("click", function(){ theme=theme==="light"?"dark":"light"; store("ob.theme",theme); applyChrome(); broadcast(); });
document.getElementById("obDensity").addEventListener("click", function(){ density=density==="compact"?"comfortable":"compact"; store("ob.density",density); applyChrome(); broadcast(); });
/* ---- tab load with skeleton + cross-fade ---- */
function b64utf8(b){ var bin=atob(b); var u=Uint8Array.from(bin,function(c){return c.charCodeAt(0);}); return new TextDecoder("utf-8").decode(u); }
/* Below 720px the tablist is a horizontally-scrolling strip, so the selected tab can sit
   off-screen. Neither .focus() nor scrollIntoView({inline:"nearest"}) reveals it reliably
   (measured), so compute the minimum scroll explicitly. Driven from show() rather than a
   focus event so click, arrow-key roving and the command palette all get it. */
function keepTabVisible(t){ var tl=t.parentElement; if(!tl||tl.scrollWidth<=tl.clientWidth) return;
  var tr=tl.getBoundingClientRect(), ar=t.getBoundingClientRect(), pad=12;
  if(ar.left<tr.left) tl.scrollLeft-=(tr.left-ar.left)+pad;
  else if(ar.right>tr.right) tl.scrollLeft+=(ar.right-tr.right)+pad;
}
function show(slug){ if(!DASH[slug]) return; current=slug;
  tabs.forEach(function(t){ var on=t.dataset.slug===slug; t.setAttribute("aria-selected", on); if(on) keepTabVisible(t); });
  if(typeof refreshGuide==="function") refreshGuide();
  skel.classList.remove("hidden"); frame.classList.add("fading");
  frame.onload=function(){ frame.classList.remove("fading"); setTimeout(function(){ skel.classList.add("hidden"); },120); broadcast(); };
  frame.srcdoc=b64utf8(DASH[slug]);
}
tabs.forEach(function(t){ t.addEventListener("click", function(){ show(t.dataset.slug); }); });
/* arrow-key roving on the tablist */
root.querySelector('[role="tablist"]').addEventListener("keydown", function(e){
  var vis=tabs.filter(function(t){return !t.classList.contains("hidden");});
  var i=vis.indexOf(document.activeElement); if(i<0) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); var j=(i+(e.key==="ArrowRight"?1:vis.length-1))%vis.length; vis[j].focus(); vis[j].click(); }
});
/* ---- messages from iframes ---- */
window.addEventListener("message", function(e){ var d=e&&e.data; if(!d||typeof d!=="object") return;
  if(d.obNav && DASH[d.obNav]) show(d.obNav);
  if(d.obReady){ ready[current]=1; broadcast(); }
  if(d.obFindings){ findings[current]=d.obFindings; }
});
/* ---- command palette ---- */
var modal=document.getElementById("obCmdkModal"), cin=document.getElementById("obCmdkInput"), clist=document.getElementById("obCmdkList");
var citems=[], cactive=0;
function sevColor(s){ return s==="crit"||s==="high"?"var(--bad)":s==="med"?"var(--warn)":s==="good"?"var(--good)":"var(--muted)"; }
function cmdkItems(){ var out=TABS.map(function(t){ return {type:"Tab", label:t.label, slug:t.slug}; });
  Object.keys(findings).forEach(function(slug){ (findings[slug]||[]).forEach(function(f){ out.push({type:"Finding", label:f.label, slug:slug, sev:f.sev}); }); });
  return out; }
function renderCmdk(){ var q=cin.value.trim().toLowerCase();
  var list=citems.filter(function(it){ return !q || it.label.toLowerCase().indexOf(q)>-1 || it.type.toLowerCase().indexOf(q)>-1; }).slice(0,60);
  if(!(cactive<list.length)) cactive=0;
  clist.innerHTML = list.length? list.map(function(it,i){
    var dot = it.type==="Finding"? '<span class="sv" style="background:'+sevColor(it.sev)+'"></span>' : '<span class="sv" style="background:var(--accent)"></span>';
    return '<div class="cmdk-row" role="option" data-i="'+i+'" aria-selected="'+(i===cactive)+'">'+dot+'<span>'+esc(it.label)+'</span><span class="rk">'+it.type+'</span></div>';
  }).join("") : '<div class="cmdk-empty">No matches.</div>';
  clist._list=list;
  [].slice.call(clist.querySelectorAll(".cmdk-row")).forEach(function(r){ r.addEventListener("click", function(){ chooseCmdk(+r.dataset.i); }); });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function openCmdk(){ citems=cmdkItems(); cactive=0; cin.value=""; renderCmdk(); modal.classList.add("open"); cin.focus(); }
function closeCmdk(){ modal.classList.remove("open"); }
function chooseCmdk(i){ var it=(clist._list||[])[i]; if(!it) return; closeCmdk(); if(it.slug&&it.slug!==current) show(it.slug); }
document.getElementById("obCmdk").addEventListener("click", openCmdk);
cin.addEventListener("input", renderCmdk);
modal.addEventListener("click", function(e){ if(e.target===modal) closeCmdk(); });
cin.addEventListener("keydown", function(e){ var n=(clist._list||[]).length;
  if(!n && (e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter")){ e.preventDefault(); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); cactive=(cactive+1)%n; renderCmdk(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); cactive=(cactive+n-1)%n; renderCmdk(); }
  else if(e.key==="Enter"){ e.preventDefault(); chooseCmdk(cactive); }
  else if(e.key==="Escape"){ closeCmdk(); } });
addEventListener("keydown", function(e){ if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); modal.classList.contains("open")?closeCmdk():openCmdk(); } });
/* ---- interview mode ---- */
document.getElementById("obDemo").addEventListener("click", function(){ demoOn=!demoOn; this.setAttribute("aria-pressed", demoOn);
  tabs.forEach(function(t){ t.classList.toggle("hidden", demoOn && DEMO.indexOf(t.dataset.slug)<0); });
  if(demoOn && DEMO.indexOf(current)<0) show(DEMO[0]); });
/* ---- guided tour ---- */
var tourCard=document.getElementById("obTourCard"), ti=0;
function renderTour(){ var s=TOUR[ti]; document.getElementById("obTourTitle").textContent=s.title; document.getElementById("obTourBody").textContent=s.body;
  document.getElementById("obTourDots").innerHTML=TOUR.map(function(_,i){return '<span class="dot'+(i===ti?" on":"")+'"></span>';}).join("");
  document.getElementById("obTourPrev").style.visibility=ti?"visible":"hidden";
  document.getElementById("obTourNext").textContent=ti===TOUR.length-1?"Done":"Next"; if(s.slug!==current) show(s.slug); }
function startTour(){ ti=0; tourCard.classList.add("open"); renderTour(); }
document.getElementById("obTour").addEventListener("click", startTour);
document.getElementById("obTourPrev").addEventListener("click", function(){ if(ti){ti--; renderTour();} });
document.getElementById("obTourNext").addEventListener("click", function(){ if(ti<TOUR.length-1){ti++; renderTour();} else tourCard.classList.remove("open"); });
addEventListener("keydown", function(e){ if(e.key==="Escape") tourCard.classList.remove("open"); });
/* ---- guide slide-over ---- */
var gPanel=document.getElementById("obGuidePanel"), gScrim=document.getElementById("obGuideScrim"), gBody=document.getElementById("obGuideBody");
function refreshGuide(){ if(gPanel.classList.contains("open")) gBody.innerHTML = (typeof insightGuide==="function") ? insightGuide(current) : ""; }
function openGuide(){ gBody.innerHTML = (typeof insightGuide==="function") ? insightGuide(current) : ""; gPanel.classList.add("open"); gScrim.classList.add("open"); }
function closeGuide(){ gPanel.classList.remove("open"); gScrim.classList.remove("open"); }
document.getElementById("obGuide").addEventListener("click", function(){ gPanel.classList.contains("open")?closeGuide():openGuide(); });
document.getElementById("obGuideClose").addEventListener("click", closeGuide);
gScrim.addEventListener("click", closeGuide);
addEventListener("keydown", function(e){ if(e.key==="Escape") closeGuide(); });

/* ---- boot ---- */
applyChrome();
show(TABS[0].slug);
</script>

</body></html>
